<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .card-glass {
        transition: transform 0.3s ease;
      }
      .card-wrapper:hover .card-glass {
        transform: translateY(-5px) scale(1.02);
      }
      .shine {
        animation: shine 5s infinite linear;
      }
      @keyframes shine {
        0% { transform: skewX(-20deg) translateX(-150px); opacity: 0; }
        5% { opacity: 0.6; }
        15% { transform: skewX(-20deg) translateX(278.75px); opacity: 0; }
        100% { transform: skewX(-20deg) translateX(278.75px); opacity: 0; }
      }
    </style>
    
    <linearGradient id="bgInfo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Liquid Glass Styles -->
    <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <linearGradient id="shine-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <clipPath id="card-clip">
      <rect width="128.75" height="100" rx="8" />
    </clipPath>
    <clipPath id="avatar-clip">
      <circle cx="20" cy="20" r="20" />
    </clipPath>
    <mask id="round">
       <rect width="600" height="200" rx="12" fill="white" />
    </mask>
  </defs>

  <!-- Background container -->
  <rect width="600" height="200" rx="12" fill="url(#bgInfo)" />
  
  <!-- Subtle Header Mesh -->
  <circle cx="0" cy="0" r="150" fill="#3b82f6" opacity="0.1" filter="url(#blur)" />
  <circle cx="600" cy="200" r="150" fill="#8b5cf6" opacity="0.1" filter="url(#blur)" />
  
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
    </filter>
  </defs>

  <!-- User Info Header -->
  <g transform="translate(20, 20)">
     <image href="https://avatars.githubusercontent.com/u/191676132?v=4" xlink:href="https://avatars.githubusercontent.com/u/191676132?v=4" x="0" y="0" width="40" height="40" clip-path="url(#avatar-clip)" />
     <text x="50" y="18" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Nimal Danyath K</text>
     <text x="50" y="36" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">@nimaldanyathk • 29 Repositories • 15 Followers</text>
  </g>

  <!-- Cards Container -->
  
            <a href="https://github.com/nimaldanyathk/repo-verse" target="_blank">
                <g class="card-wrapper" transform="translate(20, 70)">
                    <g class="card-glass" style="transform-origin: 64.375px 50px;">
                        <!-- Mood Ring / Glow Shadow -->
                        <rect width="128.75" height="100" rx="8" fill="#3178C6" opacity="0.25" filter="url(#glow-shadow)" transform="translate(0, 4)" />
                        
                        <!-- Liquid Glass Effect -->
                        <rect width="128.75" height="100" rx="8" fill="url(#glass-gradient)" stroke="url(#glass-border)" stroke-width="1.5" />
                        <!-- Inner highlight for glass -->
                        <rect width="128.75" height="100" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
                        
                        <!-- Animated Shine -->
                        <g clip-path="url(#card-clip)">
                           <rect class="shine" x="-100" y="-50" width="30" height="200" fill="url(#shine-gradient)" />
                        </g>
                    
                    <!-- Language Dot -->
                    <circle cx="15" cy="20" r="4" fill="#3178C6" />
                    
                    <!-- Name -->
                    <text x="25" y="24" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">repo-verse</text>
                    
                    <!-- Desc -->
                    <text x="15" y="42" fill="#aaa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">
                        <tspan x="15" dy="0">Generate a dynamic,</tspan><tspan x="15" dy="12">animated SVG solar</tspan><tspan x="15" dy="12">system of your GitH...</tspan>
                    </text>

                    <!-- Stats Row -->
                    <g transform="translate(10, 85)">
                        <!-- Stars -->
                        <path d="M3 0h2l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#F1C40F" transform="scale(0.8) translate(0, 2)"/> 
                        <!-- Simple Star Icon approx -->
                        <text x="12" y="8" fill="#ccc" font-family="Segoe UI, sans-serif" font-size="10">17</text>

                        <!-- Forks -->
                        <text x="50" y="8" fill="#ccc" font-family="Segoe UI, sans-serif" font-size="10">⑂ 4</text>
                    </g>
                    </g>
                </g>
            </a>
        

